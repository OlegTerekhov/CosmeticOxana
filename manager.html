<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5f0">
  <title>БЕРЕГ — кабинет управляющего</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./CSS/style.css?v=20261021-manager-v2">
  <style>
    body.manager-page{min-height:100vh;background:#f7f5f0;color:#202b27}
    .manager-wrap{width:min(100% - 32px,1000px);margin:44px auto 120px}
    .manager-brand{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:44px}
    .manager-brand a{color:inherit;text-decoration:none;font-weight:700;letter-spacing:.12em}
    .manager-brand small{display:block;font-size:9px;letter-spacing:.18em;margin-top:5px}
    .manager-intro{margin-bottom:28px}.manager-intro .overline{letter-spacing:.16em;font-size:11px}.manager-intro h1{font-size:clamp(32px,5vw,54px);line-height:1.08;margin:12px 0}.manager-intro h1 em{font-family:Georgia,serif;font-weight:400}
    .manager-card{background:#fff;border:1px solid rgba(32,43,39,.09);border-radius:18px;padding:clamp(20px,4vw,34px);box-shadow:0 12px 35px rgba(32,43,39,.04);margin-bottom:18px}
    .manager-form{display:grid;gap:16px;max-width:480px}.manager-form label{display:grid;gap:8px;font-size:13px}.manager-form input,.manager-order select{width:100%;border:1px solid #d9ded9;border-radius:10px;padding:13px 14px;font:inherit;background:#fff;color:inherit}
    .manager-form button,.manager-action{border:0;border-radius:30px;background:#203d34;color:#fff;padding:14px 18px;font:inherit;cursor:pointer}
    .manager-message{margin-top:14px;font-size:14px;line-height:1.5}.manager-message.error{color:#a33131}.manager-message.success{color:#246c48}
    .manager-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}.manager-toolbar h2{margin:0;font-size:24px}.manager-actions{display:flex;gap:8px;flex-wrap:wrap}.manager-actions button{border:1px solid #d9ded9;background:#fff;color:#203d34;border-radius:24px;padding:10px 14px;cursor:pointer;font:inherit}
    .manager-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:20px}.manager-stat{background:#f5f6f2;border-radius:12px;padding:16px}.manager-stat span{display:block;font-size:12px;color:#67716c}.manager-stat strong{display:block;font-size:24px;margin-top:6px}
    .manager-order{border:1px solid #e3e7e2;border-radius:14px;padding:18px;margin-top:14px}.manager-order-head,.manager-order-row{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}.manager-order-head strong{font-size:16px}.manager-order-head time{font-size:12px;color:#68736d}.manager-order-customer{margin:14px 0 10px;display:grid;gap:5px}.manager-order-customer a{color:#203d34}.manager-order-items{border-top:1px solid #edf0eb;border-bottom:1px solid #edf0eb;padding:10px 0;margin:10px 0}.manager-order-item{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:13px}.manager-order-total{font-size:18px;font-weight:700}.manager-order-note{font-size:13px;line-height:1.55;overflow-wrap:anywhere}.manager-order-bottom{display:flex;align-items:end;gap:10px;flex-wrap:wrap;margin-top:14px}.manager-order-bottom label{display:grid;gap:6px;font-size:12px;flex:1;min-width:180px}.manager-order-bottom button{background:#203d34;color:#fff;border:0;border-radius:24px;padding:11px 16px;cursor:pointer}.manager-empty{padding:24px 0;color:#68736d;line-height:1.6}.manager-lock{font-size:42px;margin-bottom:10px}
    @media(max-width:520px){.manager-wrap{margin-top:24px}.manager-brand{margin-bottom:30px}.manager-stats{grid-template-columns:1fr}.manager-stat{padding:12px}.manager-stat strong{font-size:21px}.manager-order{padding:14px}}
  </style>
</head>
<body class="manager-page">
  <main class="manager-wrap">
    <header class="manager-brand">
      <a href="./index.html">≈ БЕРЕГ<small>КОСМЕТИКА ЧЁРНОГО МОРЯ</small></a>
      <span class="overline">КАБИНЕТ УПРАВЛЯЮЩЕГО</span>
    </header>
    <section class="manager-intro">
      <p class="overline">ЗАКАЗЫ · ДОСТАВКА · СТАТУСЫ</p>
      <h1>Панель <em>управления.</em></h1>
      <p>Закрытая зона магазина. Для входа управляющему нужен секретный код.</p>
    </section>
    <section id="managerRoot" aria-live="polite">
      <div class="manager-card"><p>Проверяем подключение…</p></div>
    </section>
  </main>
  <script src="./JS/manager.js?v=20261021-manager-v2"></script>
</body>
</html>
